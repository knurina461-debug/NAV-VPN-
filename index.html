<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>NAV-VPN</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{--bg-color:var(--tg-theme-bg-color,#121214);--card-bg:var(--tg-theme-secondary-bg-color,#1e1e24);--text-color:var(--tg-theme-text-color,#fff);--hint-color:var(--tg-theme-hint-color,#8e8e93);--btn-color:var(--tg-theme-button-color,#2ea6ff);--btn-text:var(--tg-theme-button-text-color,#fff);--green:#34c759}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-color);color:var(--text-color);margin:0;padding:16px;display:flex;flex-direction:column;gap:12px;user-select:none;min-height:100vh}.header{text-align:center;margin:8px 0 12px}.header h2{margin:0;font-size:24px}.header p{margin:6px 0 0;font-size:14px;color:var(--hint-color)}.tariff-card{background:var(--card-bg);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,.05);box-shadow:0 4px 16px rgba(0,0,0,.15)}.info{display:flex;flex-direction:column;gap:4px}.title{font-size:17px;font-weight:600}.price{font-size:15px;font-weight:700;color:var(--green)}.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:6px}.b-disc{background:#ff9500;color:#000}.b-prof{background:#af52de;color:#fff}.b-hit{background:#ff3b30;color:#fff}.buy-btn{background:var(--btn-color);color:var(--btn-text);border:none;padding:10px 22px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}.buy-btn:active{opacity:.8}</style></head><body><div class="header"><h2>🚀 NAV-VPN</h2><p>Выберите срок подписки для Happ</p></div><div class="tariff-card"><div class="info"><div class="title">1 Месяц</div><div class="price">100 ₽ / 100 ★</div></div><button class="buy-btn" onclick="buy('1')">Купить</button></div><div class="tariff-card"><div class="info"><div class="title">2 Месяца</div><div class="price">200 ₽ / 200 ★</div></div><button class="buy-btn" onclick="buy('2')">Купить</button></div><div class="tariff-card"><div class="info"><div class="title">3 Месяца <span class="badge b-disc">СКИДКА</span></div><div class="price">250 ₽ / 250 ★</div></div><button class="buy-btn" onclick="buy('3')">Купить</button></div><div class="tariff-card"><div class="info"><div class="title">6 Месяцев <span class="badge b-prof">ВЫГОДА</span></div><div class="price">450 ₽ / 450 ★</div></div><button class="buy-btn" onclick="buy('6')">Купить</button></div><div class="tariff-card"><div class="info"><div class="title">1 Год <span class="badge b-hit">ХИТ</span></div><div class="price">800 ₽ / 800 ★</div></div><button class="buy-btn" onclick="buy('12')">Купить</button></div><script>const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}function buy(m){if(tg){try{tg.HapticFeedback?.impactOccurred('light');}catch(e){}tg.sendData(m);tg.close();}else{alert("Выбрано: "+m);}}</script></body></html>
